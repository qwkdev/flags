<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flag Guesser | Flashcards</title>

	<style>
:root {
	--bg: #111;
	--fg: #222;
	--fg2: #555;

	--text: #fff;
	--text-s: #fff5;
	--link: #08f;
	--link-s: #08f5;

	--u: 1.5vw;
	--top-height: calc(6 * var(--u));
	--bottom-height: calc(3 * var(--u));
	--pad: calc(3 * var(--u));
}
*[hidden] {
	display: none !important;
}

body {
	margin: 0;
	padding-top: calc(7 * var(--u));
	overflow-x: hidden;
	position: relative;
	background: var(--bg);
	height: max-content;
	min-height: 100vh;
	min-height: 100dvh;
	box-sizing: border-box;

    scrollbar-width: none;
}
body::-webkit-scrollbar {
	display: none;
}

#top a, #top p {
	--h: 100px;
	height: var(--h);
	box-sizing: border-box;
	background: rgba(245, 245, 255, .11);
	backdrop-filter: blur(20px);
	border: calc(.2 * var(--u)) solid rgba(255, 255, 255, .12);
	border-radius: calc(2 * var(--u));
	box-shadow: inset 0 calc(.8 * var(--h)) calc(.4 * var(--h)) calc(-.4 * var(--h)) rgba(245, 245, 255, .06);

	transition: .2s;

	&:not(.nohover) {
		&:hover {
			background: rgba(245, 245, 255, .13);
			box-shadow: inset 0 calc(.8 * var(--h)) calc(.4 * var(--h)) calc(-.4 * var(--h)) rgba(245, 245, 255, .08);
			border-top-color: rgba(255, 255, 255, .15);
			transform: scale(1.02);
		}
		&:active {
			transform: scale(0.97);
		}
	}
}

#top {
	position: absolute;
	top: calc(1 * var(--u));
	left: calc(1 * var(--u));

	display: flex;
	gap: calc(1 * var(--u));

	z-index: 999;

	a, p {
		width: max-content;
		--h: calc(5 * var(--u));

		display: flex;
		align-items: center;
		justify-content: center;
		gap: calc(3 * var(--u));

		padding: 0 calc(2.5 * var(--u));
		margin: 0;
		color: var(--text);
		font-family: Arial;
		font-size: calc(2 * var(--u));

		&::selection {
			background: var(--text-s);
		}
	}
	a {
		font-weight: 700;
		user-select: none;
	}
}

#queue {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);

	width: 40vh;
	height: 63vh;

	display: flex;
	justify-content: center;
	align-items: flex-start;
	z-index: 1;

	perspective: round(120vh, 1px);

	&[data-reset="1"] .card {
		transition: none;
	}
}

.card {
	--n: 0;
	--x: 0;
	display: inline-block;

	width: 100%;
	height: 60vh;

	position: absolute;
	box-sizing: border-box;

	z-index: calc(4 - var(--n));
	--t: translate(calc(var(--x)*1px), calc(3.5vh * (var(--n) - var(--anim)))) rotate(calc(var(--x) * .02deg)) scale(calc(1 - .1 * (var(--n) - var(--anim))), calc(1 - .07 * (var(--n) - var(--anim))));
	transform: var(--t);
	opacity: calc(1 - (1/9 * (var(--n) - var(--anim))*(var(--n) - var(--anim))));
	transition: .1s;
	transform-style: preserve-3d;

	outline: 1px solid #f00;

	>div {
		position: absolute;
		top: 0;
		left: 0;
		inset: 0;

		width: 100%;
		height: 100%;
		box-sizing: border-box;
		padding: 3vh;

		overflow: hidden;

		background: #fff;
		border-radius: 2vh;

		backface-visibility: hidden;
		-webkit-backface-visibility: hidden;
	}

	.back {
		transform: rotateY(180deg);
	}
	&[data-flip="1"] {
		transform: var(--t) rotateY(180deg);
	}
}
#active {
	cursor: grab;
	user-select: none;
	transition: .3s;

	&[data-drag="1"] {
		cursor: grabbing;
		transition: none;
	}
}

@media screen and (min-aspect-ratio: 2/3) {
	:root {
		--u: 1vh;
	}
}
	</style>
</head>
<body>
	<div id="top">
		<a>flags.qwk.gg</a>
		<p class="nohover">Learning: Example Deck Name</p>
	</div>

	<div id="queue" style="--anim: 0;">
		<div class="card" style="--n: 0; --anim: 0;" id="active">
			<div class="front">
				<p>Loading...</p>
			</div>
			<div class="back">
				<p>Back</p>
			</div>
		</div>
		<div class="card" style="--n: 1;" id="second"><div class="front"></div></div>
		<div class="card" style="--n: 2;"><div class="front"></div></div>
		<div class="card" style="--n: 3;"><div class="front"></div></div>
	</div>

	<script>
		const mtarget = 300;
		const mflip = 50;

		const cardqueue = document.getElementById('queue');

		async function wait(ms) {
			return new Promise(resolve => setTimeout(resolve, ms));
		}
		async function anim() {
			for (let n = 1; n <= 100; n++) {
				cardqueue.style.setProperty('--anim', n/100);
				await wait(10);
			}
			await wait(10);
			cardqueue.style.setProperty('--anim', 0/100);
		}

		const activecard = document.getElementById('active');
		const secondcard = document.getElementById('second');

		let start;
		activecard.addEventListener('pointerdown', e => {
			if (!active || cardqueue.dataset.ignore == '1') return;
			start = e.clientX;
			activecard.dataset.drag = '1';
		});
		document.addEventListener('pointermove', e => {
			if (activecard.dataset.drag != '1' || cardqueue.dataset.ignore == '1') return;
			let delta = e.clientX - start;
			activecard.style.setProperty('--x', delta);
			cardqueue.style.setProperty('--anim', Math.min(Math.abs(delta)/mtarget, 1));
		});

		const release = e => {
			if (activecard.dataset.drag != '1' || cardqueue.dataset.ignore == '1') return;
			activecard.dataset.drag = '0';

			delta = e.clientX - start;
			if (Math.abs(delta) >= mtarget) {
				cardqueue.dataset.ignore = '1';
				cardqueue.style.setProperty('--anim', 1);
				activecard.style.setProperty('--x', window.innerWidth * (delta > 0 ? 1 : -1));
				setTimeout(async () => {
					if (current < reviews.length-1) {
						if (current >= 0) await edit(reviews[current][0], {
							status: delta > 0 ? 1 : -1
						});
					}
					current++;
					active = current < reviews.length-1;
					activecard.innerHTML = secondcard.innerHTML;

					cardqueue.dataset.reset = '1';
					activecard.style.setProperty('--x', 0);
					cardqueue.style.setProperty('--anim', 0);
					setTimeout(() => {
						cardqueue.dataset.reset = '0';
						cardqueue.dataset.ignore = '0';
					}, 50);

					if (current < reviews.length-1) loadReview(current+1, secondcard);
				}, 100);
			} else {
				activecard.style.setProperty('--x', 0);
				cardqueue.style.setProperty('--anim', 0);
				if (Math.abs(delta) <= mflip) activecard.dataset.flip = activecard.dataset.flip == '1' ? '0' : '1';
			}
		};
		document.addEventListener('pointerup', release);
		document.addEventListener('pointercancel', release);
	</script>
</body>
</html>
