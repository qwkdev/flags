<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flag Guesser</title>

	<style>
:root {
	--bg: #035;
	--bgg: linear-gradient(to bottom, #035, #102);
	--fg: #48d;

	--text: #fff;
	--text-s: #fff5;

	--u: 1.5vw;
	--top-height: calc(6 * var(--u));
	--bottom-height: calc(3 * var(--u));
	--pad: calc(3 * var(--u));
}
*[hidden] {
	display: none !important;
}

body {
	margin: 0;
	padding-top: calc(7 * var(--u));
	overflow-x: hidden;
	position: relative;
	background-color: var(--bg);
	background-image: var(--bgg);
	height: max-content;
	min-height: 100vh;
	min-height: 100dvh;
	box-sizing: border-box;

    scrollbar-width: none;
}
body::-webkit-scrollbar {
	display: none;
}

#play, .set, #top a, #top p {
	--h: 100px;
	height: var(--h);
	box-sizing: border-box;
	background: #f5f5ff1c;
	backdrop-filter: blur(20px);
	border: calc(.2 * var(--u)) solid #ffffff1f;
	border-radius: calc(2 * var(--u));
	box-shadow: inset 0 calc(.8 * var(--h)) calc(.4 * var(--h)) calc(-.4 * var(--h)) #f5f5ff0f;

	transition: .2s;

	&:not(.nohover) {
		&:hover, &:focus {
			outline: none;
			background: #f5f5ff21;
			box-shadow: inset 0 calc(.8 * var(--h)) calc(.4 * var(--h)) calc(-.4 * var(--h)) #f5f5ff14;
			border-top-color: #ffffff26;
			transform: scale(1.02);

			&:active {
				transform: scale(0.97);
			}
		}
	}
}

#top {
	position: absolute;
	top: calc(1 * var(--u));
	left: calc(1 * var(--u));

	display: flex;
	gap: calc(1 * var(--u));

	z-index: 999;

	a, p {
		width: max-content;
		--h: calc(5 * var(--u));

		display: flex;
		align-items: center;
		justify-content: center;
		gap: calc(3 * var(--u));

		padding: 0 calc(2.5 * var(--u));
		margin: 0;
		color: var(--text);
		font-family: Arial;
		font-size: calc(2 * var(--u));
		text-decoration: none;

		&::selection {
			background: var(--text-s);
		}
	}
	a {
		font-weight: 700;
		user-select: none;
	}
}

#bottom {
	position: absolute;
	bottom: calc(1 * var(--u));
	right: calc(1 * var(--u));

	display: flex;
	flex-direction: row-reverse;
	gap: calc(.7 * var(--u));

	a {
		--c: #777;
		background: #000;
		border: 1px solid var(--c);
		text-decoration: none;
		user-select: none;

		margin: 0;
		color: var(--c);
		font-family: monospace;
		font-size: calc(1.2 * var(--u));
		line-height: calc(1.7 * var(--u));
		padding: 0 calc(.5 * var(--u));
		border-radius: calc(2 * var(--u));
		transform-origin: center;
		transition: .2s;

		&:hover {
			--c: #aaa;
			transform: scale(1.03);
		}
		&:active {
			transform: scale(0.95);
		}
	}
}

#play {
	--h: calc(9 * var(--u));
	width: calc(100% - calc(2 * var(--u)));
	margin: 0 calc(1 * var(--u));
	margin-bottom: calc(1 * var(--u));

	box-sizing: border-box;
	padding: 0 calc(2 * var(--u));

	display: flex;
	align-items: center;

	div {
		display: flex;
		flex-direction: column;
		justify-content: center;

		h2, p {
			margin: 0;
			color: var(--text);
			font-family: Arial;
			white-space: nowrap;
		}
		h2 {
			font-size: calc(2.5 * var(--u));
			font-weight: 700;
		}
		p {
			font-size: calc(1.5 * var(--u));
			font-weight: 500;
		}
	}

	a {
		position: relative;
		margin-left: auto;

		display: flex;
		align-items: center;
		justify-content: center;

		height: 60%;
		box-sizing: border-box;

		border: calc(.2 * var(--u)) solid #ffffff1f;
		border-radius: calc(1 * var(--u));

		padding: 0 calc(2 * var(--u));
		padding-bottom: calc(.1 * var(--u));
		gap: calc(.4 * var(--u));

		font-family: Arial;
		font-size: calc(2 * var(--u));
		font-weight: 700;
		color: var(--text);
		user-select: none;
		text-decoration: none;
		transition: .2s;

		&:hover {
			transform: scale(1.03);
			background: #ffffff0a;

			&:active {
				transform: scale(0.95);
			}
		}

		svg {
			height: 60%;

			stroke: var(--text);
			fill: var(--text);
		}
	}
}

#sets {
	width: 100%;
	height: max-content;
	box-sizing: border-box;
	padding: 0 calc(1 * var(--u));

	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(calc(30 * var(--u)), 100%), 1fr));
	gap: calc(1 * var(--u));

	.set {
		--h: calc(9 * var(--u));
		width: 100%;
		box-sizing: border-box;
		padding: 0 calc(2 * var(--u));
		text-decoration: none;

		display: flex;
		flex-direction: column;
		justify-content: center;

		h2, p {
			margin: 0;
			color: var(--text);
			font-family: Arial;
			white-space: nowrap;
		}
		h2 {
			font-size: calc(2.5 * var(--u));
			font-weight: 700;
		}
		p {
			font-size: calc(1.5 * var(--u));
			font-weight: 500;
		}
	}
}

@media screen and (min-aspect-ratio: 2/3) {
	:root {
		--u: 1vh;
	}
}
	</style>
</head>
<body>
	<div id="top">
		<a href="https://flags.qwk.gg/">flags.qwk.gg</a>
	</div>

	<div class="nohover" id="play">
		<div>
			<h2>Play Quiz</h2>
			<p>All 205 Flags</p>
		</div>
		<a href="/play">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M187.2 100.9C174.8 94.1 159.8 94.4 147.6 101.6C135.4 108.8 128 121.9 128 136L128 504C128 518.1 135.5 531.2 147.6 538.4C159.7 545.6 174.8 545.9 187.2 539.1L523.2 355.1C536 348.1 544 334.6 544 320C544 305.4 536 291.9 523.2 284.9L187.2 100.9z"/></svg>
			Play
		</a>
	</div>

	<div id="sets">
		<div class="set">
			<h2>Loading...</h2>
		</div>
	</div>

	<div id="bottom">
		<a href="https://qwk.gg/" target="_blank">qwk.gg</a>
	</div>

	<script>
		const sets = document.getElementById('sets');
		fetch('/sets.json').then(r => r.json()).then(sd => {
			sets.innerHTML = '';
			Object.entries(sd).forEach(([k, v]) => {
				const set = document.createElement('a');
				set.classList.add('set');
				set.href = '/learn?'+k;
				
				const h2 = document.createElement('h2');
				h2.textContent = v[0];
				set.appendChild(h2);

				const p = document.createElement('p');
				p.textContent = `${v.length - 1} Flags`;
				set.appendChild(p);

				sets.appendChild(set);
			});
		}).catch(console.error);
	</script>
</body>
</html>
