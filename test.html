<!-- Hover over the "Listen" button to see the waves. Only the first 4 cards have it.  -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draggable Glassy Flashcard</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Source+Code+Pro&display=swap" rel="stylesheet">

  <style>
    :root {
      --ui-radius: 12px;
      --card-radius: 24px;
      --card-blur: 7.64px;
      --card-opacity: 0.36;
      --btn-blur: 12px;
      --bg-blur: 3.75px;
      --bg-opacity: 0.25;
      --bg-color: #000000;
      --accent: #3392ff;
      --lamp-color: #752bff;
      --scrolbar-track-color: #262626;
      --border-color: #1a1a1a;

      --glass-body: rgba(10, 10, 10, 0.36);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-radius: 24px;
      --glass-blur: 7.64px;
      --glass-border-size: 1px;
      --galaxy-border: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.12) 100%
      );
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: transparent;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }
    ::-webkit-scrollbar-track {
      background: var(--scrolbar-track-color);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
      opacity: 0.8;
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--scrolbar-track-color);
    }

    .layer-image {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1613552641409-2c2b90491ede?q=80&w=2560&auto=format&fit=crop&ixlib=rb-4.1.0');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -3;
    }

    .layer-blur {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      backdrop-filter: blur(var(--bg-blur));
      -webkit-backdrop-filter: blur(var(--bg-blur));
      z-index: -2;
      pointer-events: none;
    }

    .layer-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      opacity: var(--bg-opacity);
      z-index: -1;
      pointer-events: none;
    }

    #app {
      position: relative;
      width: 100%;
      min-height: 100vh;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 1356px;
      margin: 0 auto;
      padding: 72px 10px;
      position: relative;
      z-index: 1;
    }

    @media (min-width: 641px) {
      .container {
          padding-left: 24px;
          padding-right: 24px;
      }
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      justify-content: center;
      justify-items: center;
      width: 100%;
    }

    @media (min-width: 912px) {
      .cards-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1280px) {
      .cards-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .card-container {
      width: 100%;
      max-width: 412px;
      aspect-ratio: 217 / 241;
      position: relative;
      perspective: 3000px;
      z-index: 10;
      will-change: transform;
      margin: 0 auto;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
      cursor: grab;
    }

    .card-inner:active {
      cursor: grabbing;
    }

    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--glass-radius);
      overflow: hidden;
      background: var(--glass-body);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transform-style: preserve-3d;
      border: 1px solid var(--glass-border);
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .card-face {
        background: rgba(10, 10, 10, 0.82);
      }
    }

    .card-front {
      z-index: 2;
    }

    .card-front .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      z-index: 0;
    }

    .card-front .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.2);
      z-index: 1;
    }

    .card-front .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, rgba(20,20,20,0.84) 0%, rgba(10,10,10,0.9) 100%);
      display: flex;
      flex-direction: column;
    }

    .card-back .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .chronicle-dots {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: clamp(1rem, 2.5vw, 1.3rem) clamp(1rem, 2.5vw, 1.3rem);
      opacity: 0.65;
      z-index: 1;
    }

    .lamp-effect {
      position: relative;
      width: 60%;
      height: 1px;
      margin: 1.5rem auto;
      background: linear-gradient(90deg, transparent, var(--lamp-color), transparent);
      opacity: 0.4;
      transition: all 0.4s ease;
    }

    .card-inner:hover .lamp-effect {
      width: 78%;
      opacity: 0.64;
      filter: brightness(1.1);
    }

    .word-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
    }

    .word-info h2 {
      font-size: 2.25rem;
      margin: 0;
      font-weight: 700;
      color: white;
    }

    .word-info p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      max-width: 280px;
      margin: 0;
      font-style: italic;
    }

    .tag-container {
      display: flex;
      width: 100%;
      margin-bottom: 12px;
      justify-content: flex-start;
    }

    .tag-container--right {
      justify-content: flex-end;
    }

    .tag {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--ui-radius);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .glass-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--ui-radius);
      padding: 12px 14px;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(var(--btn-blur));
      -webkit-backdrop-filter: blur(var(--btn-blur));
      transition: all 0.6s ease;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      font-size: 12px;
      width: 100%;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .glass-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .glass-btn.audio {
      margin-top: 16px;
      width: auto;
      min-width: 112px;
      border-radius: 50px;
      padding: 10px 20px;
      text-transform: none;
      font-size: 11px;
    }

    .glass-btn.audio::before,
    .glass-btn.audio::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.85);
    }

    .glass-btn.audio::before {
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .glass-btn.audio::after {
      inset: -14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .glass-btn.audio:hover::before {
      animation: seaWave 1.1s ease-out infinite;
    }

    .glass-btn.audio:hover::after {
      animation: seaWave 1.1s ease-out infinite 0.35s;
    }

    @keyframes seaWave {
      0% {
        opacity: 0.75;
        transform: scale(0.95);
      }
      70% {
        opacity: 0.18;
      }
      100% {
        opacity: 0;
        transform: scale(1.8);
      }
    }

    .credits-container {
      margin-top: 60px;
      padding-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: left;
    }

    .credits-container h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: white;
    }

    .credit-line {
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      color: #aaa;
      margin: 12px 0;
      line-height: 1.6;
    }

    .credit-link {
      text-decoration: none;
      color: white;
      position: relative;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .credit-link::before {
      position: absolute;
      content: "";
      width: 100%;
      height: 1px;
      background-color: currentColor;
      transform: scale(1,1);
      transition: background-color .5s ease-in-out;
      bottom: -2px;
      left: 0;
    }

    .credit-link:hover {
      color: var(--accent);
    }

    .credit-link:hover::before {
      animation: link-anim ease 1s 1 300ms;
      transform-origin: right;
    }

    @keyframes link-anim {
      50% {
        transform: scaleX(0);
      }
      50.1% {
        transform: translateX(-100%) scalex(-0.01);
      }
      100% {
        transform: translateX(-100%) scalex(-1);
      }
    }

    .back-footer {
      margin-top: auto;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <!-- Background Layers -->
  <div class="layer-image"></div>
  <div class="layer-blur"></div>
  <div class="layer-overlay"></div>

  <div id="app" :style="rootStyles">
    <div class="container">
      <div class="cards-grid">
        <div
          v-for="card in cards"
          :key="card.id"
          class="card-container"
          :style="getDragStyle(card)"
          :dir="card.isRTL ? 'rtl' : 'ltr'"
        >
          <div
            class="card-inner"
            :class="{ 'is-flipped': card.isFlipped }"
            @pointerdown="startDrag($event, card)"
          >
            <!-- Front Face -->
            <div class="card-face card-front">
              <img v-if="card.imageUrl" :src="card.imageUrl" class="card-image" draggable="false">
              <div class="overlay"></div>
              <div class="card-content">
                <div class="tag-container">
                  <div class="tag">
                    <span v-if="card.language === 'hebrew'">עברית</span>
                    <span v-else-if="card.language === 'italian'">Italiano</span>
                    <span v-else>English</span>
                  </div>
                </div>
                <div style="margin-top: auto; display: flex; justify-content: center;">
                  <button class="glass-btn" @click.stop="card.isFlipped = true">
                    {{ card.revealText }}
                  </button>
                </div>
              </div>
            </div>

            <!-- Back Face -->
            <div class="card-face card-back">
              <div class="chronicle-dots"></div>
              <div class="card-content">
                <div class="tag-container"">
                  <div class="tag">
                    <span v-if="card.language === 'hebrew'">אוצר מילים</span>
                    <span v-else-if="card.language === 'italian'">Italiano</span>
                    <span v-else>Vocabulary</span>
                  </div>
                </div>

                <div class="word-info">
                  <h2>{{ card.word }}</h2>
                  <div class="lamp-effect"></div>
                  <p>{{ card.definition }}</p>
                  <button v-if="card.audioUrl" class="glass-btn audio" @click.stop="playAudio(card.audioUrl)">
                    <i data-lucide="volume-2" style="width: 14px; height: 14px;"></i>
                    Listen
                  </button>
                </div>

                <div class="back-footer">
                  <button class="glass-btn" @click.stop="card.isFlipped = false">
                    {{ card.hideText }}
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="credits-container" v-once>
        <h2>Credit</h2>
        <div v-for="(line, idx) in parsedCredits" :key="idx" class="credit-line" v-html="line"></div>
      </div>
    </div>
  </div>

        const parsedCredits = computed(() => {
          return creditsMarkdown
            .split('\n')
            .filter(l => l.trim())
            .map(line => {
              return line.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer" class="credit-link">$1</a>');
            });
        });

        let activeCard = null;
        let startX = 0, startY = 0;

        const startDrag = (e, card) => {
          if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
          activeCard = card;
          startX = e.clientX - card.x;
          startY = e.clientY - card.y;
          document.addEventListener('pointermove', onDrag, { passive: true });
          document.addEventListener('pointerup', stopDrag, { passive: true });
        };

        const onDrag = (e) => {
          if (!activeCard) return;
          activeCard.x = e.clientX - startX;
          activeCard.y = e.clientY - startY;
        };

        const stopDrag = () => {
          activeCard = null;
          document.removeEventListener('pointermove', onDrag);
          document.removeEventListener('pointerup', stopDrag);
        };

        const getDragStyle = (card) => ({
          transform: `translate3d(${card.x}px, ${card.y}px, 0)`,
          zIndex: activeCard === card ? 100 : 10,
          transition: activeCard === card ? 'none' : 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)'
        });

        const playAudio = (url) => { new Audio(url).play(); };

        onMounted(() => lucide.createIcons());

        return { cards, parsedCredits, startDrag, getDragStyle, playAudio, settings, rootStyles };
      }
    }).mount('#app');
